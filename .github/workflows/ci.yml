name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests -q
      - name: Check the CLI starts and every command has help
        run: |
          finplan --version
          for cmd in budget expenses paychecks savings emergency-fund debt \
                     debt-plan mortgage refinance invest retire networth; do
            finplan "$cmd" --help > /dev/null || exit 1
          done
      - name: Check the legacy wrappers still run
        run: |
          python biweekly_pay.py --pay-date 2026-01-02 > /dev/null
          python debt_calculator.py --principal 5400 --interest-rate 22.9 \
            --monthly-payment 200 > /dev/null
