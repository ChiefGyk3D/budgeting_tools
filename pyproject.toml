[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finplan"
version = "2.0.0"
description = "A personal financial planning toolkit: budgets, debt payoff, mortgages, investments and retirement projections."
readme = "README.md"
requires-python = ">=3.8"
# No license is declared: the repository has never carried one. Add a LICENSE
# file and set this field before publishing to an index.
keywords = ["finance", "budget", "mortgage", "amortization", "retirement", "debt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
# No runtime dependencies. The original mortgage calculator needed
# python-dateutil; finplan.core.dates replaces it with the standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
finplan = "finplan.cli:main"

[project.urls]
Homepage = "https://github.com/ChiefGyk3D/budgeting_tools"
Issues = "https://github.com/ChiefGyk3D/budgeting_tools/issues"

[tool.setuptools.packages.find]
include = ["finplan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
