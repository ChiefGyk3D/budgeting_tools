[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finplan"
version = "2.0.0"
description = "A personal financial planning toolkit: budgets, debt payoff, mortgages, investments and retirement projections."
readme = "README.md"
requires-python = ">=3.8"
# DATED TRADEOFF: setuptools deprecates this TOML-table form (and the License
# classifier below) with a removal deadline of 2027-Feb-18. The replacement is
# the PEP 639 SPDX string, `license = "Apache-2.0"` plus `license-files`, but
# that needs setuptools>=77, which cannot run on Python 3.8 (setuptools dropped
# 3.8 at v76). So the two cannot both be satisfied while requires-python allows
# 3.8. Before Feb 2027, either drop Python 3.8 (EOL since Oct 2024) and switch
# to the SPDX form, or pin an older setuptools in build-system.requires.
license = { text = "Apache-2.0" }
keywords = ["finance", "budget", "mortgage", "amortization", "retirement", "debt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
# No runtime dependencies. The original mortgage calculator needed
# python-dateutil; finplan.core.dates replaces it with the standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
finplan = "finplan.cli:main"

[project.urls]
Homepage = "https://github.com/ChiefGyk3D/budgeting_tools"
Issues = "https://github.com/ChiefGyk3D/budgeting_tools/issues"

[tool.setuptools.packages.find]
include = ["finplan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
